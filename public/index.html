<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f6f3" />
    <title>Brick Out</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Brick Out inicio">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>brick out</span>
        </a>
        <div class="topbar-actions">
          <label class="upload-btn">
            <input id="imageInput" type="file" accept="image/*" />
            <span>＋ <span class="desktop-label">Importar imagen</span><span class="mobile-label">Imagen</span></span>
          </label>
          <button id="fullscreenBtn" class="secondary-btn" type="button" aria-label="Pantalla completa" title="Pantalla completa (F)">
            ⛶<span class="desktop-label"> Pantalla completa</span>
          </button>
          <button id="pauseBtn" class="secondary-btn" type="button">Pausa</button>
          <button id="startBtn" class="primary-btn" type="button">Iniciar</button>
        </div>
      </header>

      <section class="game-heading" aria-label="Estado de la partida">
        <div class="stat"><span class="stat-label">Puntos</span><strong id="score">0000</strong></div>
        <div class="stat"><span class="stat-label">Vidas</span><strong id="lives">3</strong></div>
        <div class="stat"><span class="stat-label">Nivel</span><strong id="level">1</strong></div>
        <p id="status" class="status" aria-live="polite">Listo para jugar</p>
      </section>

      <section class="game-panel" aria-label="Juego Brick Out">
        <canvas id="gameCanvas" width="960" height="600" aria-label="Campo de juego"></canvas>
        <!-- Solo en ?clean / ?tiktok: la barra superior no existe, así que estos dos atajos aparecen al mover o tocar. -->
        <div id="cleanTools" class="clean-tools">
          <button id="cleanImportBtn" type="button">＋ Imagen</button>
          <a class="tool-link" href="./">Modo normal</a>
        </div>
        <!-- Aviso de power-up nuevo: va dentro del campo para que también se vea en pantalla completa. -->
        <div id="powerPopup" class="power-popup" role="dialog" aria-modal="true" aria-labelledby="powerPopupName" aria-describedby="powerPopupDesc" hidden>
          <div class="power-card">
            <p class="power-kicker">Power-up nuevo</p>
            <div id="powerPopupBadge" class="power-badge" aria-hidden="true"></div>
            <h2 id="powerPopupName"></h2>
            <p id="powerPopupDesc" class="power-desc"></p>
            <p id="powerPopupMeta" class="power-meta"></p>
            <button id="powerPopupBtn" class="primary-btn" type="button">Entendido</button>
          </div>
        </div>
      </section>

      <footer class="game-footer">
        <p class="controls-hint">Mueve con el mouse o usa <kbd>←</kbd> <kbd>→</kbd> / <kbd>A</kbd> <kbd>D</kbd> · <kbd>Espacio</kbd> para lanzar · <kbd>F</kbd> pantalla completa · <a class="mode-link" href="?tiktok">Modo TikTok</a></p>
        <details class="power-guide">
          <summary>Power-ups <span id="powerCount" class="power-count"></span></summary>
          <ul id="powerList" class="power-list"></ul>
        </details>
      </footer>
    </main>
    <script src="image-bricks.js"></script>
    <script src="script.js"></script>
  </body>
</html>
